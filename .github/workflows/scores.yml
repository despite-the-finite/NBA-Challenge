# Calls the live-score sync every 15 minutes. Vercel's free plan only runs cron jobs once a day,
# so this workflow (free for public repos) keeps scores, locks and notifications fresh during games.
# Setup: repo Settings -> Secrets and variables -> Actions -> add
#   secret  CRON_SECRET  (same value as the Vercel env var)
#   variable APP_URL     e.g. https://nba-challenge.vercel.app
name: Sync scores
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      job:
        description: 'schedule or scores'
        default: 'scores'
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call /api/tick
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          JOB: ${{ github.event.inputs.job || 'scores' }}
        run: |
          test -n "$APP_URL" || { echo "Set the APP_URL repository variable"; exit 1; }
          curl -sS --fail-with-body -m 120 "$APP_URL/api/tick?job=$JOB" -H "Authorization: Bearer $CRON_SECRET"
